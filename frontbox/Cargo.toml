[package]
name = "frontbox"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-protocol = { path = "../fast-protocol", features = ["serde"] }
frontbox-derive = { path = "../frontbox-derive" }
log = "0.4.29"
futures-util = "0.3.32"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4.4"
tokio-util = { version = "0.7.18", features = ["codec"] }
dyn-clone = "1.0.20"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
priority-queue = "2.7.0"
itertools = "0.14.0"
image = { version = "0.25.9" }
rand = "0.10.0"
noise = "0.9.0"

[dev-dependencies]
env_logger = "0.11.9"
