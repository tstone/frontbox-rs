[package]
name = "frontbox-pinball"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
frontbox-core = { path = "../frontbox-core" }
frontbox-gfx = { path = "../frontbox-gfx" }
frontbox-led = { path = "../frontbox-led" }
frontbox-scene = { path = "../frontbox-scene" }
tokio = { version = "1", features = ["full"] }
dyn-clone = "1.0.20"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
frontbox-core = { path = "../frontbox-core", features = ["testing"] }
