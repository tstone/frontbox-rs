[package]
name = "frontbox-gfx"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
dyn-clone = "1.0.20"
glam = { version = "0.33.2", features = ["serde"] }
image = "0.25.9"
log = "0.4.29"
num-traits = "0.2.19"
palette = { version = "0.7.6", features = ["random"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "sample_grid"
harness = false
