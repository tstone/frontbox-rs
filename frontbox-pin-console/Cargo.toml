[package]
name = "frontbox-pin-console"
version = "0.1.0"
edition = "2024"
include = ["src/**", "build.rs", "web/dist/**", "Cargo.toml"]

[dependencies]
log = "0.4.29"
frontbox = { path = "../frontbox", features = ["ts"] }
frontbox-turn-based = { path = "../frontbox-turn-based" }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
serde_json = "1.0.151"
serde = "1.0.229"
ts-rs = "12.0.1"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
mime_guess = "2.0.5"

[dev-dependencies]
env_logger = "0.11.9"
