[package]
name = "frontbox-led"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-protocol = { path = "../fast-protocol" }
frontbox-core = { path = "../frontbox-core" }
frontbox-gfx = { path = "../frontbox-gfx" }
dyn-clone = "1.0.20"
indexmap = { version = "2.14.0", features = ["serde"] }
image = "0.25.9"
itertools = "0.14.0"
log = "0.4.29"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true, features = ["indexmap-impl"] }

[dev-dependencies]
env_logger = "0.11.9"
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }

[features]
ts = ["dep:ts-rs", "frontbox-core/ts", "frontbox-gfx/ts"]
