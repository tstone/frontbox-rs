[package]
name = "frontbox-led"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-protocol = { path = "../fast-protocol" }
frontbox-core = { path = "../frontbox-core" }
frontbox-gfx = { path = "../frontbox-gfx" }
dyn-clone = "1.0.20"
image = "0.25.9"
itertools = "0.14.0"
log = "0.4.29"
rand = "0.10.0"

[dev-dependencies]
env_logger = "0.11.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
