[package]
name = "frontbox-display"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
frontbox-core = { path = "../frontbox-core" }
frontbox-gfx = { path = "../frontbox-gfx" }
frontbox-scene = { path = "../frontbox-scene" }
frontbox-sound = { path = "../frontbox-sound", optional = true }
image = "0.25.9"
rand = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
default = ["sound"]
sound = ["dep:frontbox-sound"]

[dev-dependencies]
frontbox-core = { path = "../frontbox-core", features = ["testing"] }
