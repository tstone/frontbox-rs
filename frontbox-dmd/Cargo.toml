[package]
name = "frontbox-dmd"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
frontbox-core = { path = "../frontbox-core" }
frontbox-gfx = { path = "../frontbox-gfx" }
frontbox-sound = { path = "../frontbox-sound", optional = true }
rusb = "0.9.4"
image = "0.25.9"
rand = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }

[features]
default = ["sound"]
sound = ["dep:frontbox-sound"]
ts = ["dep:ts-rs", "frontbox-gfx/ts"]
