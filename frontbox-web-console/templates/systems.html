<div>
  {% for group in groups %}
  <div class="col-md-12" style="margin-bottom: 1.75em;">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title d-flex align-items-center">
          <span class="status-dot {% if group.active %}status-dot-animated bg-green{% else %}bg-secondary{% endif %} me-2"></span>
          {{ group.key }}
        </h3>
      </div>
      <div class="list-group list-group-flush">
        {% for system in group.systems %}
        <div class="list-group-item d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center">
            <span class="status-dot {% if system.active %}bg-green{% else %}bg-secondary{% endif %} me-2"></span>
            {{ system.name }}
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
